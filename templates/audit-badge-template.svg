<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- UBIC 溯源评定徽章 模板 v1.0（§21.1 v1.12.8）
       使用规则：仅随有效评定证书展示；证书失效/撤销即停用；不得暗示政府或官方认证；
       不得修改文字结构与配色语义；对外主品牌=万物互联·数智共生（中文优先） -->
  <circle cx="120" cy="120" r="116" fill="#C9A227"/>
  <circle cx="120" cy="120" r="104" fill="#1E3A5F"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#C9A227" stroke-width="3"/>
  <text x="120" y="66" text-anchor="middle" font-family="serif" font-size="14" fill="#C9A227">万物互联 · 数智共生</text>
  <text x="120" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="50" font-weight="bold" fill="#FFFFFF" letter-spacing="4">UBIC</text>
  <text x="120" y="152" text-anchor="middle" font-family="serif" font-size="14" fill="#C9A227">溯源评定 · EVALUATED</text>
  <line x1="70" y1="166" x2="170" y2="166" stroke="#C9A227" stroke-width="1"/>
  <text x="120" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFFFFF">UBIC-AUD-{{YYYY}}-{{NNN}}</text>
  <text x="120" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#8FA8C8">VALID THRU {{YYYY-MM-DD}}</text>
</svg>
